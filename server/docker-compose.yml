services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: bjtu
      POSTGRES_USER: bjtu
      POSTGRES_PASSWORD: bjtu
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      DJANGO_SECRET_KEY: change-me-in-prod
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "*"
      POSTGRES_DB: bjtu
      POSTGRES_USER: bjtu
      POSTGRES_PASSWORD: bjtu
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    entrypoint:
      [
        "/bin/sh",
        "docker/entrypoint.sh",
        "gunicorn",
        "config.wsgi:application",
        "--bind",
        "0.0.0.0:8000",
        "--workers",
        "3",
      ]
    volumes:
      - media:/app/media
    depends_on:
      - db

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
